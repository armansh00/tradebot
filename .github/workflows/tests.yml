name: tests

# The suite had never run anywhere but a laptop. A green Actions page that
# says nothing about whether the code still works is decoration.

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "config.yaml", "requirements.txt",
            ".github/workflows/**"]
  pull_request:
  workflow_dispatch: {}

# Public repo: fork PRs run this workflow. No secrets are referenced and the
# token is pinned read-only, so untrusted code cannot reach the account or
# write to the repo.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=src python -m pytest tests/ -q
