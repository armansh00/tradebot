name: forecast-score

# Score yesterday's frozen forecast after the close, from Alpaca's daily bars.
#
# The scorer is a separate program from whoever wrote the forecast, and it runs
# on a schedule rather than on request, so the verdict never depends on someone
# deciding it is a good moment to look. It places no orders and reads no state
# beyond the forecast file.

on:
  schedule:
    - cron: "40 21 * * 1-5"     # 17:40 ET, after the close and the late prints
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/tradebot/forecast.py"
      - ".github/workflows/forecast-score.yml"

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Declare the climatology if it has never been declared
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: PYTHONPATH=src python -m tradebot climatology 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Score every unscored forecast
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          PYTHONPATH=src python -m tradebot score-forecast | tee /tmp/scored.txt || true
          { echo '### forecast verdicts'; echo '```'; cat /tmp/scored.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Running totals
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          PYTHONPATH=src python -m tradebot forecast-report | tee /tmp/agg.txt || true
          { echo '### running totals'; echo '```'; cat /tmp/agg.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the verdict
        if: always()
        run: |
          git config user.name  tradebot
          git config user.email tradebot@users.noreply.github.com
          git add forecasts || true
          git diff --cached --quiet && exit 0
          git commit -q -m "forecast scored $(date -u +%F) [skip ci]"
          # Several workflows commit to this repo and they can fire in the
          # same second — the first run of this job lost that race and took
          # the verdict down with it. Retry rather than treat a lost race as
          # a scoring failure.
          for attempt in 1 2 3 4; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((attempt * 5))
          done
          echo "could not publish the verdict after 4 attempts" >&2
          exit 1
