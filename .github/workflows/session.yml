name: trading-session

# GitHub's `schedule` is best-effort and has been measured running hours late
# on this repo (2026-08-31: the 13:40 and 14:05 UTC ticks never fired at all;
# the Sunday review cron ran 3h50m late). So cron is asked for one thing only —
# start a process sometime this morning — and the process does its own timing
# off the exchange calendar. Legs 2 and 3 exist because a hosted job is capped
# at 6 hours; each picks up where the previous handed off, and exits in seconds
# if the session is already over. Steps are duplicated rather than shared:
# GitHub Actions does not support YAML anchors.

# Seven independent start attempts, not one. GitHub drops individual scheduled
# events under load rather than disabling the workflow, so seven chances beat
# one. Minutes are deliberately off the hour — top-of-hour is the documented
# congestion peak. Measured delays on this repo so far: Sunday's review cron
# 3h50m late, Monday's daily cron 5h57m late, and three intraday events never
# delivered at all — so the early starts are not paranoia. The spread also
# absorbs DST, when the open moves from 13:30 to 14:30 UTC.
#
# THERE IS DELIBERATELY NO `concurrency:` BLOCK HERE. There used to be, on the
# theory that it made duplicates harmless. It does not queue duplicates — a
# newly triggered run supersedes the one already waiting, and GitHub cancels
# it. On 2026-09-01 runs 4 through 8 were all cancelled that way; the seven
# launch chances collapsed into one, that one lost five and three-quarter
# hours, and so did the trading day. Redundancy that a scheduler is allowed to
# cancel is not redundancy.
#
# Duplicate WORK is prevented where it can be done correctly instead: each
# process re-reads the shared ledger immediately before every tick and skips
# what another process already did, and every intraday order carries a
# deterministic client_order_id that Alpaca itself refuses to fill twice. So
# the spare runs stay alive, cost nothing on a normal day, and take over the
# next tick on a day the leader dies.
on:
  schedule:
    - cron: "11 3 * * 1-5"     # earliest: survives a ~10h delivery delay
    - cron: "29 5 * * 1-5"
    - cron: "17 8 * * 1-5"
    - cron: "23 10 * * 1-5"
    - cron: "41 11 * * 1-5"
    - cron: "7 13 * * 1-5"     # 23 min before the open
    - cron: "34 13 * * 1-5"    # just after — still saves the intraday ticks
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  leg1:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Trading session (paper account)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_FAST_KEY: ${{ secrets.ALPACA_FAST_KEY }}
          ALPACA_FAST_SECRET: ${{ secrets.ALPACA_FAST_SECRET }}
          ALPACA_MOVERS_KEY: ${{ secrets.ALPACA_MOVERS_KEY }}
          ALPACA_MOVERS_SECRET: ${{ secrets.ALPACA_MOVERS_SECRET }}
          TRADEBOT_AUTOCOMMIT: "1"
          TRADEBOT_SESSION_DEADLINE_MIN: "340"
        run: PYTHONPATH=src python -m tradebot session

  leg2:
    needs: leg1
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
