name: fast-arm-intraday
# SUPERSEDED 2026-08-31 by session.yml. The 30-minute cron ticks this
# workflow relied on were not delivered by GitHub's scheduler (see session.py).
# Kept for manual recovery of a single tick; no longer runs on a schedule.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fast-arm tick (simulated fills, live data)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_FAST_KEY: ${{ secrets.ALPACA_FAST_KEY }}
          ALPACA_FAST_SECRET: ${{ secrets.ALPACA_FAST_SECRET }}
          ALPACA_MOVERS_KEY: ${{ secrets.ALPACA_MOVERS_KEY }}
          ALPACA_MOVERS_SECRET: ${{ secrets.ALPACA_MOVERS_SECRET }}
        run: |
          PYTHONPATH=src python -m tradebot run-fast
          PYTHONPATH=src python -m tradebot run-movers
      - name: Commit fast ledger
        run: |
          git config user.name tradebot
          git config user.email tradebot@users.noreply.github.com
          git pull --rebase || true
          git add ledger_fast.jsonl state_fast.json || true
          git diff --cached --quiet || git commit -m "fast tick $(date -u +%FT%H:%M) [skip ci]"
          git push
