name: threshold-sweep

# Replays the pre-registered threshold grid over recent sessions and writes
# the result to sweeps/. Run it whenever; it never touches an account and
# cannot affect the live experiment.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validation engine (report card)
        env:
          ALPACA_FAST_KEY: ${{ secrets.ALPACA_FAST_KEY }}
          ALPACA_FAST_SECRET: ${{ secrets.ALPACA_FAST_SECRET }}
        run: PYTHONPATH=src python -m tradebot validate

      - name: Rotation test (buy yesterday's losers vs winners)
        env:
          ALPACA_FAST_KEY: ${{ secrets.ALPACA_FAST_KEY }}
          ALPACA_FAST_SECRET: ${{ secrets.ALPACA_FAST_SECRET }}
        run: PYTHONPATH=src python -m tradebot rotate

      - name: Replay the grid
        env:
          ALPACA_FAST_KEY: ${{ secrets.ALPACA_FAST_KEY }}
          ALPACA_FAST_SECRET: ${{ secrets.ALPACA_FAST_SECRET }}
        run: PYTHONPATH=src python -m tradebot sweep
      - name: Commit the sweep
        run: |
          git config user.name tradebot
          git config user.email tradebot@users.noreply.github.com
          for f in sweeps research_log.jsonl vault.json; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "threshold sweep $(date -u +%F) [skip ci]"
          git pull --rebase -q && git push
