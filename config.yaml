# Each arm trades its own $50 paper account. Before 2026-08-31 all three
# shared one $100k account and the intraday arms only simulated their fills;
# Alpaca now allows extra paper accounts with a chosen starting balance, so
# the arms are genuinely separate books and every fill is a real order.
accounts:
  # Alpaca allows a maximum of three paper accounts and the original $100k one
  # already exists, so the slow arm stays on it and book_cap keeps its tradable
  # book at $50. The two intraday arms get genuinely $50 accounts, which is
  # where a real balance matters — settlement and buying power actually bind
  # a day trader.
  slow:   {key_env: ALPACA_API_KEY,    secret_env: ALPACA_SECRET_KEY}
  fast:   {key_env: ALPACA_FAST_KEY,   secret_env: ALPACA_FAST_SECRET}
  movers: {key_env: ALPACA_MOVERS_KEY, secret_env: ALPACA_MOVERS_SECRET}

# tradebot configuration — every number here is pre-registered.
# Changing strategy or risk parameters mid-test invalidates the paper test:
# log a note in NOTES.md and restart the evaluation clock.

universe: [SPY, QQQ, IWM, EFA, TLT, GLD]

strategy:
  name: dual-momentum-trend
  top_n: 2                # hold at most 2 ETFs
  sma_days: 200           # trend filter: only hold if price > 200-day SMA
  mom_lookback_days: 252  # 12-month momentum...
  mom_skip_days: 21       # ...skipping the most recent month (12-1 momentum)
  cash_buffer_pct: 5      # keep 5% of equity in cash
  min_order_notional: 2.0 # ignore rebalance dust under $2

risk:
  book_cap: 50.0             # bot trades this book size regardless of account equity (0 = whole account)
  max_order_notional: 30.0   # no single order above $30
  max_positions: 2
  max_drawdown_pct: 10.0     # equity 10% below high-water mark -> flatten + halt
  halt_file: .halt           # presence of this file stops all trading

evaluation:
  # Pre-registered pass/fail for the paper phase. The $50 goes live
  # only if ALL of these hold. Decided before the first trade, on purpose.
  min_weeks: 8
  require_net_positive: true
  max_drawdown_pct: 10.0
  max_manual_overrides: 0

fast:
  # THE EXPERIMENT ARM — intraday opening-range breakout, simulated fills
  # on live data with explicit modeled costs. Same $50, virtual account.
  universe: [SPY, QQQ, AAPL, MSFT, NVDA, TSLA, AMZN, META]
  start_cash: 50.0
  or_minutes: 30            # opening range = first 30 minutes
  tick_minutes: 30          # tick cadence inside the trading session
  fills_mode: broker        # real paper orders; costs charged as a separate line
  top_k: 2                  # at most 2 concurrent positions
  cost_bps_per_side: 5      # modeled half-spread + slippage per side (10 bps round trip)
  max_trades_per_day: 6     # entry cap
  daily_loss_stop_pct: 3.0  # day P&L -3% -> flatten, done for the day
  flat_minutes_before_close: 30  # everything closed by 15:30 ET (30-min tick cadence safe)
  max_drawdown_pct: 10.0    # same kill switch as the slow arm

movers:
  # ARM 3 — same intraday ORB discipline, but the universe is rebuilt every
  # morning from the market's most-active stocks. Tests the "trade whatever
  # moves most" hypothesis against Barber-Odean attention-driven-buying
  # evidence. Higher modeled costs: volatile movers carry wider spreads.
  universe_mode: most_active
  universe_size: 10          # top-N most-active stocks each day
  min_price: 5.0             # skip sub-$5 names
  start_cash: 50.0
  or_minutes: 30
  top_k: 2
  cost_bps_per_side: 15      # 30 bps round trip — movers' spreads are real
  max_trades_per_day: 6
  daily_loss_stop_pct: 3.0
  flat_minutes_before_close: 30
  max_drawdown_pct: 10.0

fast_evaluation:
  # Pre-registered: what the fast arm must show to be taken seriously.
  min_weeks: 8
  must_beat_slow_arm: true
  require_net_positive: true

movers_evaluation:
  # Pre-registered: what the movers arm must show to be taken seriously.
  min_weeks: 8
  require_net_positive: true
  must_beat_both_arms: true

# Threshold sweep — a REPLAY, not extra live arms. The grid is pre-registered
# here so the analysis cannot be tuned after seeing results. See
# DESIGN-threshold-sweep.md for why picking the best of k arms fails.
sweep:
  thresholds_pct: [0.0, 0.25, 0.5, 1.0, 1.5, 2.0, 3.0]
  lookback_days: 30
